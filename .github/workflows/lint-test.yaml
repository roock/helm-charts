name: Lint and Test Helm Charts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart templates render
        run: |
          helm lint charts/spliit
          helm template spliit charts/spliit \
            --set postgres.host=postgresql.default.svc.cluster.local >/dev/null

  render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test rendered resources
        run: |
          helm template spliit charts/spliit \
            --set postgres.host=postgresql.default.svc.cluster.local > /tmp/rendered.yaml
          grep -q "kind: Deployment" /tmp/rendered.yaml
          grep -q "kind: Service" /tmp/rendered.yaml
