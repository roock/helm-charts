replicaCount: 1

image:
  repository: ghcr.io/spliit-app/spliit
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /api/health/liveness
    port: http
readinessProbe:
  httpGet:
    path: /api/health/readiness
    port: http

postgres:
  host: ""
  port: 5432
  database: spliit
  user: spliit
  password: ""

config:
  baseUrl: ""
  defaultCurrencyCode: USD

env: []

envFrom: []

nodeSelector: {}

tolerations: []

affinity: {}
